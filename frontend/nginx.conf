# ShelfLife SPA + API reverse proxy.
#
# The React app calls "/api/<endpoint>" (Axios baseURL defaults to "/api"). The backend
# itself exposes endpoints WITHOUT an "/api" prefix (e.g. /auth/login), so — exactly like
# the Vite dev proxy — this config strips the "/api" prefix before forwarding to the
# backend container, addressed by its docker-compose SERVICE NAME ("backend"), NOT localhost.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API traffic to the backend service inside the Docker network.
    # Using Docker's embedded DNS (127.0.0.11) with a variable upstream defers name
    # resolution to request time, so nginx starts even if the backend is momentarily absent.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $backend_upstream backend;

        # Strip the "/api" prefix: /api/auth/login -> /auth/login
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$backend_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history-mode fallback: unknown paths (e.g. /admin/users, /picker/dashboard)
    # are client-side routes, so serve index.html and let React Router resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
